<!-- SharedComponents.html — Reusable UI Components & Helpers for Agranusa KPI Tracker -->
<script>
window.AgranusaUI = (function() {
  function esc(str) {
    if (str == null) return '';
    const d = document.createElement('div');
    d.textContent = String(str);
    return d.innerHTML;
  }

  function getInitials(name) {
    if (!name) return '??';
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function renderEmployeeBadge(type) {
    const isStaff = String(type).toUpperCase() === 'STAFF';
    if (isStaff) {
      return `<span class="px-1.5 py-0.5 rounded bg-surface-container text-on-surface font-label-xs text-label-xs uppercase font-bold tracking-wider">STAFF</span>`;
    }
    return `<span class="px-1.5 py-0.5 rounded bg-surface-container-low text-on-surface-variant font-label-xs text-label-xs uppercase font-semibold border border-dashed border-outline-variant">DW</span>`;
  }

  function renderStatusChip(status, poin) {
    const s = String(status || '').toLowerCase();
    if (s === 'selesai') {
      return `<span class="px-2.5 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-xs text-label-xs font-semibold flex items-center gap-1 shrink-0">
        <span class="material-symbols-rounded text-[14px]">check_circle</span> Selesai (+10 pts)
      </span>`;
    }
    if (s === 'lanjut') {
      return `<span class="px-2.5 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-xs text-label-xs font-semibold flex items-center gap-1 shrink-0">
        <span class="material-symbols-rounded text-[14px]">redo</span> Lanjut (+8 pts)
      </span>`;
    }
    if (s === 'batal' || s === 'tidak dikerjakan') {
      return `<span class="px-2.5 py-1 rounded-full bg-error-container text-on-error-container font-label-xs text-label-xs font-semibold flex items-center gap-1 shrink-0">
        <span class="material-symbols-rounded text-[14px]">cancel</span> Batal (-10 pts)
      </span>`;
    }
    return `<span class="px-2.5 py-1 rounded-full bg-secondary-fixed/50 text-on-secondary-fixed font-label-xs text-label-xs font-semibold flex items-center gap-1 shrink-0">
      <span class="material-symbols-rounded text-[14px]">hourglass_top</span> Belum Dinilai
    </span>`;
  }

  function renderEmptyState(icon, title, desc, actionBtn) {
    return `
      <div class="flex flex-col items-center justify-center text-center p-8 bg-surface-container-lowest rounded-xl shadow-sm my-4">
        <div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-3">
          <span class="material-symbols-rounded text-[32px]">${esc(icon || 'inbox')}</span>
        </div>
        <h4 class="font-title-sm text-title-sm text-on-surface font-semibold mb-1">${esc(title)}</h4>
        <p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mb-4">${esc(desc)}</p>
        ${actionBtn ? actionBtn : ''}
      </div>
    `;
  }

  function renderSkeletonCard() {
    return `
      <div class="rounded-xl bg-surface-container-lowest p-space-md shadow-sm animate-pulse space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-full bg-surface-container"></div>
            <div class="space-y-1">
              <div class="w-24 h-4 bg-surface-container rounded"></div>
              <div class="w-16 h-3 bg-surface-container rounded"></div>
            </div>
          </div>
          <div class="w-20 h-6 bg-surface-container rounded-full"></div>
        </div>
        <div class="w-full h-12 bg-surface-container-low rounded-lg"></div>
      </div>
    `;
  }

  return {
    esc,
    getInitials,
    renderEmployeeBadge,
    renderStatusChip,
    renderEmptyState,
    renderSkeletonCard
  };
})();
</script>
