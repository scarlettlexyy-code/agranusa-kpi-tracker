<!DOCTYPE html>
<!--
  Dashboard.html — Agranusa KPI Tracker
  Fungsi utama: renderDashboard()
  Dipanggil oleh router di Index.html, render ke #app-content
-->
<script>
/* ============================================================
   DASHBOARD PAGE — renderDashboard()
   ============================================================ */

function renderDashboard() {
  setTimeout(() => {
    if (typeof gasRun === 'function') {
      gasRun('getDashboardData', AppState.tanggal, AppState.shift)
        .then(onDashboardData)
        .catch(onDashboardError);
    } else if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(onDashboardData)
        .withFailureHandler(onDashboardError)
        .getDashboardData(AppState.tanggal, AppState.shift);
    } else {
      onDashboardData(_getDashboardDemoData());
    }
  }, 20);

  return `
    <div class="px-4 py-3 space-y-3">
      <div class="rounded-xl bg-white p-4 shadow-sm border border-slate-200 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/4"></div>
        <div class="h-7 bg-slate-200 rounded w-1/2"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="h-24 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse"></div>
        <div class="h-24 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse"></div>
      </div>
    </div>
  `;
}

function _getDashboardDemoData() {
  return {
    success: true,
    data: {
      leader: { nama: 'Pak Wayan', inisial: 'PW' },
      shift: { nama: 'Pagi', tanggal: '2024-10-24', jamMulai: '07:00', jamSelesai: '15:00' },
      progress: { qcSelesai: 25, qcTotal: 28, pctQC: 90 },
      kpiMatrix: { totalTugas: 48, totalStaff: 32, totalDW: 16, selesai: 34, lanjut: 10, tertunda: 4, belumDinilai: 0 },
      poin: { total: 400, breakdown: [{ label: 'Dasar', nilai: 380 }, { label: 'Penyesuaian', nilai: 20 }] },
      perhatian: [
        { id: '1', nama: 'Ganti Duvet & Linen VIP Villa 04', karyawan: 'Ketut Arya', tipeKaryawan: 'STAFF', status: 'Lanjut', alasan: 'Stok Linen Premium Habis di Bin 02', villa: 'Villa 04', departemen: 'Housekeeping' },
        { id: '2', nama: 'Pembersihan Balcony Jacuzzi Villa 09', karyawan: 'I Gede Dharma', tipeKaryawan: 'DW', status: 'Batal', alasan: 'Tamu Pasang DND (Do Not Disturb)', villa: 'Villa 09', departemen: 'Pool & Garden' }
      ],
      topPerformer: [
        { rank: 1, nama: 'Ketut Arya', inisial: 'KA', poin: 90, tipe: 'STAFF', selesai: 9, onTimePct: 100 },
        { rank: 2, nama: 'Ni Made Sunari', inisial: 'NS', poin: 88, tipe: 'STAFF', selesai: 8, onTimePct: 98 },
        { rank: 3, nama: 'Gede Rai', inisial: 'GR', poin: 78, tipe: 'DW', selesai: 8, onTimePct: 92 }
      ],
      qcTerbaru: [
        { id: 'QC-1', villa: 'Villa Suite 02', area: 'Master Bedroom', kategori: 'Housekeeping', deskripsi: 'Presidential Suite Turn Down lolos standar aroma lemongrass & sudut 45', status: 'Lolos QC 100/100', waktu: '3m lalu' }
      ]
    }
  };
}

/* ---------- Error handler ---------- */
function onDashboardError(err) {
  hideLoading();
  const el = document.getElementById('app-content');
  if (!el) return;
  el.innerHTML = renderEmptyState
    ? renderEmptyState('error', 'Gagal memuat data', err ? err.message || String(err) : 'Coba lagi sebentar.')
    : `<div class="p-6 text-center text-error">${err ? err.message || String(err) : 'Error'}</div>`;
  showToast('Gagal memuat dashboard', 'error');
}

/* ---------- Main data handler ---------- */
function onDashboardData(resp) {
  hideLoading();
  const el = document.getElementById('app-content');
  if (!el) return;

  if (!resp || !resp.success) {
    onDashboardError(resp ? { message: resp.error } : null);
    return;
  }

  const d = resp.data;
  /*
    Expected shape:
    {
      leader: { nama, inisial },
      shift: { nama, jamMulai, jamSelesai, tanggal },
      progress: { qcSelesai, qcTotal, pctQC },
      kpiMatrix: { totalTugas, totalStaff, totalDW, selesai, lanjut, tertunda, belumDinilai },
      poin: { total, breakdown: [{ label, nilai }] },
      perhatian: [{ id, nama, karyawan, status, villa, departemen }],
      topPerformer: [{ nama, inisial, poin, tipe, rank }],
      qcTerbaru: [{ id, villa, area, kategori, deskripsi, status, waktu }]
    }
  */

  const waktu = _getGreeting();
  const tglFmt = _formatTanggal(d.shift?.tanggal || AppState.tanggal);
  const leader = d.leader?.nama || 'Leader';

  el.innerHTML = `
    <div class="flex flex-col gap-4 pb-24">
      ${_buildGreetingCard(waktu, leader, tglFmt, d)}
      ${_buildShiftStatusBar(d)}
      ${_buildKPIMatrix(d.kpiMatrix || {})}
      ${_buildPointsBanner(d.poin || {})}
      ${_buildPerhatian(d.perhatian || [])}
      ${_buildTopPerformer(d.topPerformer || [])}
      ${_buildQCTerbaru(d.qcTerbaru || [])}
    </div>
  `;

  _attachDashboardEvents();
}

/* ============================================================
   SECTION BUILDERS
   ============================================================ */

function _buildGreetingCard(waktu, leader, tglFmt, d) {
  return `
    <div class="mx-4 mt-4 rounded-2xl p-5" style="background: linear-gradient(135deg,#131b2e 0%,#1e2d4a 100%);">
      <!-- Badge Row -->
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold tracking-widest px-2 py-0.5 rounded-full" style="background:#ffddb0;color:#131b2e;">DUTY LEADER</span>
        <span class="flex items-center gap-1.5 text-xs text-emerald-400">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          Live Dispatch
        </span>
      </div>

      <!-- Greeting -->
      <h1 class="text-xl font-bold text-white leading-snug">
        Selamat ${_escHtml(waktu)}, Pak ${_escHtml(leader)}! 👋
      </h1>
      <p class="text-sm mt-1" style="color:#ffddb0;">${_escHtml(tglFmt)}</p>

      <!-- CTA Buttons -->
      <div class="flex gap-3 mt-4">
        <button id="btn-salin-wa"
          class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold transition active:scale-95"
          style="background:#ffddb0;color:#131b2e;">
          <span class="material-symbols-outlined text-base">content_copy</span>
          Salin WA Shift
        </button>
        <button id="btn-buat-tugas"
          class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold text-white border transition active:scale-95"
          style="border-color:#ffddb0;color:#ffddb0;">
          <span class="material-symbols-outlined text-base">add_task</span>
          + Buat Tugas
        </button>
      </div>
    </div>
  `;
}

function _buildShiftStatusBar(d) {
  const shift = d.shift || {};
  const prog = d.progress || {};
  const pct = Math.min(100, Math.round(prog.pctQC || 0));
  const qcSelesai = prog.qcSelesai || 0;
  const qcTotal = prog.qcTotal || 0;

  return `
    <div class="mx-4 rounded-2xl bg-white border border-outline-variant p-4 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <div>
          <p class="font-bold text-sm" style="color:#131b2e;">Shift ${_escHtml(shift.nama || '-')}</p>
          <p class="text-xs text-gray-500">${_escHtml(shift.jamMulai || '--:--')} – ${_escHtml(shift.jamSelesai || '--:--')} WITA</p>
        </div>
        <span class="text-xs font-semibold px-2 py-1 rounded-full" style="background:#e8f5e9;color:#069669;">
          ${qcSelesai} / ${qcTotal} QC ✓
        </span>
      </div>
      <!-- Progress Bar -->
      <div class="w-full bg-gray-100 rounded-full h-2.5">
        <div class="h-2.5 rounded-full transition-all duration-700"
          style="width:${pct}%;background:#069669;"></div>
      </div>
      <p class="text-xs text-gray-500 mt-1.5">${pct}% QC selesai · ${qcSelesai} Selesai QC / ${qcTotal} Total Aktif</p>
    </div>
  `;
}

function _buildKPIMatrix(m) {
  const totalTugas = m.totalTugas || 0;
  const staff = m.totalStaff || 0;
  const dw = m.totalDW || 0;
  const selesai = m.selesai || 0;
  const lanjut = m.lanjut || 0;
  const tertunda = m.tertunda || 0;
  const pctSelesai = totalTugas > 0 ? Math.round((selesai / totalTugas) * 100) : 0;

  const tiles = [
    {
      label: 'Total Tugas',
      value: totalTugas,
      sub: `${staff} Staff · ${dw} DW`,
      icon: 'assignment',
      bg: '#f0f4ff',
      color: '#131b2e',
    },
    {
      label: 'Selesai',
      value: selesai,
      sub: `+10 pts · ${pctSelesai}%`,
      icon: 'check_circle',
      bg: '#e8f5e9',
      color: '#069669',
    },
    {
      label: 'Lanjut',
      value: lanjut,
      sub: '+8 pts',
      icon: 'pending',
      bg: '#fff8e1',
      color: '#f59e0b',
    },
    {
      label: 'Tertunda',
      value: tertunda,
      sub: '-10 pts',
      icon: 'cancel',
      bg: '#ffdad6',
      color: '#ba1a1a',
    },
  ];

  const tileHTML = tiles.map(t => `
    <div class="rounded-xl p-3 flex flex-col gap-1" style="background:${t.bg};">
      <span class="material-symbols-outlined text-xl" style="color:${t.color};">${t.icon}</span>
      <p class="text-2xl font-bold leading-none" style="color:${t.color};">${t.value}</p>
      <p class="text-xs font-semibold" style="color:${t.color};">${t.label}</p>
      <p class="text-xs opacity-70" style="color:${t.color};">${t.sub}</p>
    </div>
  `).join('');

  return `
    <div class="mx-4">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Matriks KPI Shift</p>
      <div class="grid grid-cols-2 gap-3">${tileHTML}</div>
    </div>
  `;
}

function _buildPointsBanner(poin) {
  const total = poin.total || 0;
  const breakdown = Array.isArray(poin.breakdown) ? poin.breakdown : [];
  const bkHTML = breakdown.map(b => `
    <div class="flex justify-between text-xs" style="color:#ffddb0;">
      <span>${_escHtml(b.label)}</span>
      <span class="font-bold">${b.nilai > 0 ? '+' : ''}${b.nilai}</span>
    </div>
  `).join('');

  return `
    <div class="mx-4 rounded-2xl p-5" style="background:#1e2d4a;">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-semibold" style="color:#ffddb0;">
          <span class="material-symbols-outlined align-middle text-base mr-1">military_tech</span>
          Total Poin Shift
        </span>
        <span class="text-3xl font-bold text-white">${total} <span class="text-sm font-normal" style="color:#ffddb0;">pts</span></span>
      </div>
      ${bkHTML ? `<div class="border-t border-white/10 mt-3 pt-3 flex flex-col gap-1">${bkHTML}</div>` : ''}
    </div>
  `;
}

function _buildPerhatian(list) {
  if (!list.length) {
    return `
      <div class="mx-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Perlu Perhatian</p>
        <div class="rounded-xl bg-white border border-outline-variant p-6 text-center">
          <span class="material-symbols-outlined text-4xl text-gray-300">verified</span>
          <p class="text-sm text-gray-400 mt-1">Semua tugas berjalan lancar 🎉</p>
        </div>
      </div>
    `;
  }

  const items = list.map(t => {
    const isLanjut = t.status === 'Lanjut';
    const statusColor = isLanjut ? '#f59e0b' : '#ba1a1a';
    const statusBg = isLanjut ? '#fff8e1' : '#ffdad6';
    const statusLabel = t.status || 'Tertunda';
    return `
      <div class="item-perhatian flex items-center gap-3 p-3 rounded-xl border border-outline-variant bg-white active:bg-gray-50 cursor-pointer transition"
        data-id="${_escHtml(t.id || '')}">
        <span class="material-symbols-outlined text-2xl" style="color:${statusColor};">${isLanjut ? 'pending' : 'cancel'}</span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-800 truncate">${_escHtml(t.nama || '-')}</p>
          <p class="text-xs text-gray-500 truncate">${_escHtml(t.karyawan || '-')} · ${_escHtml(t.villa || '-')}</p>
        </div>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap flex-shrink-0"
          style="background:${statusBg};color:${statusColor};">${_escHtml(statusLabel)}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="mx-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Perlu Perhatian</p>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:#ffdad6;color:#ba1a1a;">${list.length} item</span>
      </div>
      <div class="flex flex-col gap-2">${items}</div>
    </div>
  `;
}

function _buildTopPerformer(list) {
  const medals = ['🥇', '🥈', '🥉'];
  const medalColor = ['#f59e0b', '#94a3b8', '#cd7f32'];

  const items = list.slice(0, 3).map((p, i) => `
    <div class="flex items-center gap-3 p-3 rounded-xl" style="background:${i === 0 ? '#fff8e1' : '#f8fafc'};">
      <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm text-white flex-shrink-0"
        style="background:${i === 0 ? '#f59e0b' : i === 1 ? '#94a3b8' : '#cd7f32'};">
        ${_escHtml(p.inisial || p.nama?.substring(0, 2).toUpperCase() || '??')}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-800 truncate">${medals[i]} ${_escHtml(p.nama || '-')}</p>
        <p class="text-xs text-gray-500">${_escHtml(p.tipe || '-')}</p>
      </div>
      <span class="font-bold text-sm" style="color:${medalColor[i]};">${p.poin || 0} <span class="text-xs font-normal text-gray-400">pts</span></span>
    </div>
  `).join('');

  if (!list.length) {
    return `
      <div class="mx-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Top Performer</p>
        <div class="rounded-xl bg-white border border-outline-variant p-5 text-center">
          <span class="material-symbols-outlined text-4xl text-gray-300">leaderboard</span>
          <p class="text-sm text-gray-400 mt-1">Belum ada data poin</p>
        </div>
      </div>
    `;
  }

  return `
    <div class="mx-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Top Performer Shift</p>
        <button id="btn-lihat-semua-kpi" class="text-xs font-semibold" style="color:#131b2e;">Lihat Semua →</button>
      </div>
      <div class="flex flex-col gap-2 rounded-2xl border border-outline-variant bg-white p-3">${items}</div>
    </div>
  `;
}

function _buildQCTerbaru(list) {
  if (!list.length) {
    return `
      <div class="mx-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">QC Terbaru</p>
        <div class="rounded-xl bg-white border border-outline-variant p-5 text-center">
          <span class="material-symbols-outlined text-4xl text-gray-300">verified_user</span>
          <p class="text-sm text-gray-400 mt-1">Belum ada laporan QC</p>
        </div>
      </div>
    `;
  }

  const statusMap = {
    'Lulus': { bg: '#e8f5e9', color: '#069669' },
    'Perbaikan': { bg: '#fff8e1', color: '#f59e0b' },
    'Gagal': { bg: '#ffdad6', color: '#ba1a1a' },
  };

  const cards = list.slice(0, 3).map(q => {
    const st = statusMap[q.status] || { bg: '#f1f5f9', color: '#64748b' };
    return `
      <div class="flex items-center gap-3 border-b border-outline-variant last:border-0 pb-3 last:pb-0">
        <span class="material-symbols-outlined text-2xl" style="color:#069669;">verified_user</span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-800 truncate">${_escHtml(q.villa || '-')} · ${_escHtml(q.area || '-')}</p>
          <p class="text-xs text-gray-500 truncate">${_escHtml(q.kategori || '-')} · ${_escHtml(q.waktu || '-')}</p>
        </div>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap flex-shrink-0"
          style="background:${st.bg};color:${st.color};">${_escHtml(q.status || '-')}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="mx-4 mb-2">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">QC Terbaru</p>
      <div class="rounded-2xl bg-white border border-outline-variant p-4 flex flex-col gap-3">${cards}</div>
    </div>
  `;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */

function _attachDashboardEvents() {
  /* Salin WA Shift */
  const btnWA = document.getElementById('btn-salin-wa');
  if (btnWA) {
    btnWA.addEventListener('click', function () {
      btnWA.disabled = true;
      btnWA.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">progress_activity</span> Memuat...';
      google.script.run
        .withSuccessHandler(function (resp) {
          btnWA.disabled = false;
          btnWA.innerHTML = '<span class="material-symbols-outlined text-base">content_copy</span> Salin WA Shift';
          if (resp && resp.success && resp.data) {
            navigator.clipboard.writeText(resp.data)
              .then(() => showToast('Ringkasan shift disalin ke clipboard!', 'success'))
              .catch(() => {
                // Fallback untuk browser yang tak support clipboard API
                const ta = document.createElement('textarea');
                ta.value = resp.data;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Ringkasan shift disalin!', 'success');
              });
          } else {
            showToast('Gagal mengambil ringkasan shift', 'error');
          }
        })
        .withFailureHandler(function () {
          btnWA.disabled = false;
          btnWA.innerHTML = '<span class="material-symbols-outlined text-base">content_copy</span> Salin WA Shift';
          showToast('Gagal mengambil ringkasan shift', 'error');
        })
        .getShiftSummaryText(AppState.tanggal, AppState.shift);
    });
  }

  /* Buat Tugas */
  const btnTugas = document.getElementById('btn-buat-tugas');
  if (btnTugas) {
    btnTugas.addEventListener('click', function () {
      navigateTo('penugasan');
    });
  }

  /* Lihat Semua KPI */
  const btnKPI = document.getElementById('btn-lihat-semua-kpi');
  if (btnKPI) {
    btnKPI.addEventListener('click', function () {
      navigateTo('kpi');
    });
  }

  /* Item Perhatian */
  document.querySelectorAll('.item-perhatian').forEach(function (el) {
    el.addEventListener('click', function () {
      navigateTo('monitoring');
    });
  });
}

/* ============================================================
   HELPERS
   ============================================================ */

function _getGreeting() {
  const jam = new Date().getHours();
  if (jam >= 5 && jam < 12) return 'Pagi';
  if (jam >= 12 && jam < 18) return 'Sore';
  return 'Malam';
}

function _formatTanggal(str) {
  if (!str) return '';
  const hariMap = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
  const bulanMap = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const d = new Date(str);
  if (isNaN(d)) return str;
  return `${hariMap[d.getDay()]}, ${d.getDate()} ${bulanMap[d.getMonth()]} ${d.getFullYear()}`;
}

function _escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
