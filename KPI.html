<!DOCTYPE html>
<!--
  KPI.html — Agranusa KPI Tracker
  Fungsi utama: renderKPI()
  Dipanggil oleh router di Index.html, render ke #app-content
-->
<script>
/* ============================================================
   KPI LEADERBOARD PAGE — renderKPI()
   ============================================================ */

function renderKPI() {
  setTimeout(() => {
    if (typeof gasRun === 'function') {
      gasRun('getKPILeaderboard', AppState.tanggal, AppState.shift)
        .then(onKPIData)
        .catch(onKPIError);
    } else if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(onKPIData)
        .withFailureHandler(onKPIError)
        .getKPILeaderboard(AppState.tanggal, AppState.shift);
    } else {
      onKPIData(_getKPIDemoData());
    }
  }, 20);

  return `
    <div class="px-4 py-3 space-y-3">
      <div class="rounded-xl bg-white p-4 shadow-sm border border-slate-200 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-7 bg-slate-200 rounded w-1/2"></div>
      </div>
      <div class="space-y-2">
        <div class="h-16 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse"></div>
        <div class="h-16 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse"></div>
        <div class="h-16 bg-white rounded-xl shadow-sm border border-slate-200 animate-pulse"></div>
      </div>
    </div>
  `;
}

function _getKPIDemoData() {
  return {
    success: true,
    data: {
      leaderboard: [
        { rank: 1, nama: 'Ketut Arya', tipe: 'STAFF', departemen: 'Housekeeping Lead', inisial: 'KA', selesai: 9, lanjut: 1, batal: 0, poin: 90, ontime_pct: 100, qc_flawless: 1 },
        { rank: 2, nama: 'Ni Made Sunari', tipe: 'STAFF', departemen: 'Housekeeping', inisial: 'NS', selesai: 8, lanjut: 0, batal: 0, poin: 88, ontime_pct: 98, qc_flawless: 1 },
        { rank: 3, nama: 'Gede Rai', tipe: 'DW', departemen: 'Pool & Garden', inisial: 'GR', selesai: 8, lanjut: 0, batal: 0, poin: 78, ontime_pct: 92, qc_flawless: 0 },
        { rank: 4, nama: 'Wayan Arta', tipe: 'STAFF', departemen: 'Butler Service', inisial: 'WA', selesai: 5, lanjut: 1, batal: 0, poin: 58, ontime_pct: 90, qc_flawless: 0 },
        { rank: 5, nama: 'I Gede Dharma', tipe: 'DW', departemen: 'Pool & Garden', inisial: 'GD', selesai: 4, lanjut: 0, batal: 1, poin: 30, ontime_pct: 80, qc_flawless: 0 },
      ],
      teamStats: { totalPoin: 400, avgPoin: 80, totalSelesai: 34, totalQCFlawless: 2 },
      shiftInfo: { tanggal: '2024-10-24', shift: 'Pagi', leader: 'Pak Wayan', status: 'aktif' }
    }
  };
}

/* ---------- Error handler ---------- */
function onKPIError(err) {
  hideLoading();
  const el = document.getElementById('app-content');
  if (!el) return;
  el.innerHTML = renderEmptyState
    ? renderEmptyState('error', 'Gagal memuat leaderboard', err ? err.message || String(err) : 'Coba lagi sebentar.')
    : `<div class="p-6 text-center text-error">${err ? err.message || String(err) : 'Error'}</div>`;
  showToast('Gagal memuat KPI', 'error');
}

/* ---------- Main data handler ---------- */
function onKPIData(resp) {
  hideLoading();
  const el = document.getElementById('app-content');
  if (!el) return;

  if (!resp || !resp.success) {
    onKPIError(resp ? { message: resp.error } : null);
    return;
  }

  const d = resp.data;
  /*
    Expected shape:
    {
      leaderboard: [{ rank, nama, tipe, departemen, inisial, selesai, lanjut, batal, poin, ontime_pct, qc_flawless }],
      teamStats: { totalPoin, avgPoin, totalSelesai, totalQCFlawless },
      shiftInfo: { tanggal, shift, leader, status },
      shiftHistory: [{ id, tanggal, shift, leader, totalPoin, totalSelesai, status }]  // opsional
    }
  */

  const leaderboard = Array.isArray(d.leaderboard) ? d.leaderboard : [];
  const teamStats = d.teamStats || {};
  const shiftInfo = d.shiftInfo || {};
  const shiftHistory = Array.isArray(d.shiftHistory) ? d.shiftHistory : [];

  el.innerHTML = `
    <div class="flex flex-col gap-4 pb-24">
      ${_buildKPIHeader(shiftInfo)}
      ${_buildFilterTabs()}
      ${_buildPodium(leaderboard.slice(0, 3))}
      ${_buildTeamStats(teamStats)}
      ${_buildLeaderboardTable(leaderboard)}
      ${shiftHistory.length ? _buildShiftHistory(shiftHistory) : ''}
    </div>
  `;

  _attachKPIEvents();
}

/* ============================================================
   SECTION BUILDERS
   ============================================================ */

function _buildKPIHeader(shiftInfo) {
  const shift = shiftInfo.shift || '-';
  const tanggal = _kpiFormatTanggal(shiftInfo.tanggal);
  const leader = shiftInfo.leader || '-';
  const isAktif = shiftInfo.status === 'aktif';

  return `
    <div class="mx-4 mt-4 rounded-2xl p-5" style="background:linear-gradient(135deg,#131b2e 0%,#1e2d4a 100%);">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold tracking-widest px-2 py-0.5 rounded-full" style="background:#ffddb0;color:#131b2e;">
          LEADERBOARD KPI
        </span>
        <span class="flex items-center gap-1 text-xs" style="color:${isAktif ? '#4ade80' : '#94a3b8'};">
          ${isAktif
            ? `<span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span> Aktif`
            : `<span class="material-symbols-outlined text-xs">lock</span> Terkunci`
          }
        </span>
      </div>
      <h1 class="text-lg font-bold text-white mt-2">Shift ${_kpiEsc(shift)}</h1>
      <p class="text-sm mt-0.5" style="color:#ffddb0;">${_kpiEsc(tanggal)} · Leader: ${_kpiEsc(leader)}</p>
    </div>
  `;
}

function _buildFilterTabs() {
  /* Hanya visual untuk MVP, hanya tab "Shift ini" yang aktif */
  const tabs = [
    { label: 'Shift Ini', active: true },
    { label: 'Minggu Ini', active: false },
    { label: 'Bulan Ini', active: false },
  ];

  const tabHTML = tabs.map(t => `
    <button class="kpi-filter-tab px-4 py-2 rounded-full text-sm font-semibold transition whitespace-nowrap"
      style="${t.active
        ? 'background:#131b2e;color:#ffddb0;'
        : 'background:#f1f5f9;color:#64748b;'}"
      ${t.active ? 'data-active="true"' : ''}>
      ${_kpiEsc(t.label)}
    </button>
  `).join('');

  return `
    <div class="mx-4 overflow-x-auto">
      <div class="flex gap-2 w-max">${tabHTML}</div>
    </div>
  `;
}

function _buildPodium(top3) {
  if (!top3.length) {
    return `
      <div class="mx-4 rounded-2xl bg-white border border-outline-variant p-6 text-center">
        <span class="material-symbols-outlined text-5xl text-gray-200">leaderboard</span>
        <p class="text-sm text-gray-400 mt-2">Belum ada data poin shift ini</p>
      </div>
    `;
  }

  /* Susunan podium: ke-2 (kiri) — ke-1 (tengah, lebih tinggi) — ke-3 (kanan) */
  const podiumOrder = [top3[1], top3[0], top3[2]].filter(Boolean);
  const isCenter = [false, true, false];

  const gradients = [
    'linear-gradient(135deg,#c0c0c0,#e8e8e8)',  /* Silver  - #2 */
    'linear-gradient(135deg,#f59e0b,#fbbf24)',   /* Gold    - #1 */
    'linear-gradient(135deg,#cd7f32,#e8a060)',   /* Bronze  - #3 */
  ];
  const textColors = ['#64748b', '#92400e', '#7c4a1a'];
  const heights = ['h-20', 'h-28', 'h-16'];
  const rankLabels = ['🥈 #2', '🥇 #1', '🥉 #3'];
  const realRanks = [1, 0, 2]; // index ke top3[]

  const cols = podiumOrder.map((p, i) => {
    const center = isCenter[i];
    const r = realRanks[i];
    const orig = top3[r] || p;
    return `
      <div class="flex flex-col items-center flex-1">
        <!-- Avatar -->
        <div class="w-${center ? 14 : 11} h-${center ? 14 : 11} rounded-full flex items-center justify-center font-bold text-${center ? 'xl' : 'base'} text-white mb-1 shadow-lg flex-shrink-0"
          style="background:${gradients[i]};color:${textColors[i]};">
          ${_kpiEsc(p.inisial || p.nama?.substring(0, 2).toUpperCase() || '??')}
        </div>
        <!-- Name -->
        <p class="text-xs font-bold text-center text-gray-800 leading-tight px-1 truncate w-full text-center">${_kpiEsc(p.nama || '-')}</p>
        <p class="text-xs font-bold" style="color:${center ? '#f59e0b' : '#94a3b8'};">${p.poin || 0} pts</p>
        <p class="text-xs text-gray-400">${p.selesai || 0} tugas</p>
        <p class="text-xs text-gray-400">${p.ontime_pct || 0}% on-time</p>
        <!-- Podium block -->
        <div class="${heights[i]} w-full mt-2 rounded-t-xl flex items-center justify-center font-bold text-white text-sm"
          style="background:${gradients[i]};color:${textColors[i]};">
          ${rankLabels[i]}
        </div>
      </div>
    `;
  });

  return `
    <div class="mx-4">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">🏆 Podium Terbaik</p>
      <div class="flex items-end gap-2 bg-white border border-outline-variant rounded-2xl p-4 shadow-sm">
        ${cols.join('')}
      </div>
    </div>
  `;
}

function _buildTeamStats(ts) {
  const stats = [
    { label: 'Total Poin Tim', value: ts.totalPoin || 0, unit: 'pts', icon: 'military_tech', color: '#f59e0b' },
    { label: 'Rata-rata Poin', value: ts.avgPoin || 0, unit: 'pts/org', icon: 'bar_chart', color: '#069669' },
    { label: 'Tugas Selesai', value: ts.totalSelesai || 0, unit: 'tugas', icon: 'check_circle', color: '#131b2e' },
    { label: 'QC Flawless', value: ts.totalQCFlawless || 0, unit: 'QC', icon: 'verified', color: '#7c3aed' },
  ];

  const tiles = stats.map(s => `
    <div class="rounded-xl p-3 bg-white border border-outline-variant flex flex-col gap-1">
      <span class="material-symbols-outlined text-xl" style="color:${s.color};">${s.icon}</span>
      <p class="text-xl font-bold leading-none" style="color:${s.color};">${s.value}</p>
      <p class="text-xs text-gray-500">${s.label}</p>
      <p class="text-xs font-semibold" style="color:${s.color};">${s.unit}</p>
    </div>
  `).join('');

  return `
    <div class="mx-4">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Statistik Tim</p>
      <div class="grid grid-cols-2 gap-3">${tiles}</div>
    </div>
  `;
}

function _buildLeaderboardTable(leaderboard) {
  if (!leaderboard.length) {
    return `
      <div class="mx-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Leaderboard Lengkap</p>
        <div class="rounded-xl bg-white border border-outline-variant p-6 text-center">
          <span class="material-symbols-outlined text-4xl text-gray-200">group</span>
          <p class="text-sm text-gray-400 mt-1">Belum ada data</p>
        </div>
      </div>
    `;
  }

  const trendIcon = (poin) => {
    if (poin > 50) return '<span style="color:#069669;">↑</span>';
    if (poin < 30) return '<span style="color:#ba1a1a;">↓</span>';
    return '<span style="color:#94a3b8;">→</span>';
  };

  const tipeColor = (tipe) => tipe === 'STAFF'
    ? 'background:#e8f5e9;color:#069669;'
    : 'background:#fff8e1;color:#f59e0b;';

  const rows = leaderboard.map((p, i) => {
    const isTop3 = i < 3;
    const rankStyle = isTop3 ? 'font-bold' : '';
    const rowBg = i === 0 ? 'background:#fffbeb;' : '';
    return `
      <tr style="${rowBg}" class="border-b border-outline-variant last:border-0">
        <td class="py-3 pl-3 pr-2 text-sm ${rankStyle} text-center" style="color:${isTop3 ? '#f59e0b' : '#64748b'};">${p.rank || i + 1}</td>
        <td class="py-3 pr-2">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white"
            style="background:${i === 0 ? '#f59e0b' : i === 1 ? '#94a3b8' : i === 2 ? '#cd7f32' : '#131b2e'};">
            ${_kpiEsc(p.inisial || (p.nama || '??').substring(0, 2).toUpperCase())}
          </div>
        </td>
        <td class="py-3 pr-2">
          <p class="text-sm font-semibold text-gray-800 whitespace-nowrap">${_kpiEsc(p.nama || '-')}</p>
          <p class="text-xs text-gray-400">${_kpiEsc(p.departemen || '-')}</p>
        </td>
        <td class="py-3 pr-2 text-center">
          <span class="text-xs font-bold px-1.5 py-0.5 rounded-full" style="${tipeColor(p.tipe)}">${_kpiEsc(p.tipe || '-')}</span>
        </td>
        <td class="py-3 pr-2 text-center text-sm text-gray-700">${p.selesai || 0}</td>
        <td class="py-3 pr-3 text-center">
          <span class="text-sm font-bold" style="color:#131b2e;">${p.poin || 0}</span>
          <span class="text-xs text-gray-400 ml-0.5">pts</span>
        </td>
        <td class="py-3 pr-3 text-center text-base">${trendIcon(p.poin)}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="mx-4">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Leaderboard Lengkap</p>
      <div class="rounded-2xl bg-white border border-outline-variant overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="border-b border-outline-variant" style="background:#f8fafc;">
                <th class="py-2 pl-3 pr-2 text-xs text-gray-400 font-semibold text-center">#</th>
                <th class="py-2 pr-2 text-xs text-gray-400 font-semibold"></th>
                <th class="py-2 pr-2 text-xs text-gray-400 font-semibold">Nama</th>
                <th class="py-2 pr-2 text-xs text-gray-400 font-semibold text-center">Tipe</th>
                <th class="py-2 pr-2 text-xs text-gray-400 font-semibold text-center">Selesai</th>
                <th class="py-2 pr-3 text-xs text-gray-400 font-semibold text-center">Poin</th>
                <th class="py-2 pr-3 text-xs text-gray-400 font-semibold text-center">↕</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function _buildShiftHistory(history) {
  const items = history.map(h => `
    <details class="border border-outline-variant rounded-xl overflow-hidden">
      <summary class="flex items-center justify-between cursor-pointer select-none px-4 py-3 bg-white hover:bg-gray-50 transition">
        <div>
          <p class="text-sm font-semibold text-gray-800">Shift ${_kpiEsc(h.shift || '-')} · ${_kpiEsc(_kpiFormatTanggal(h.tanggal))}</p>
          <p class="text-xs text-gray-500">Leader: ${_kpiEsc(h.leader || '-')}</p>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-2">
          <span class="text-sm font-bold" style="color:#131b2e;">${h.totalPoin || 0} pts</span>
          <span class="material-symbols-outlined text-gray-400 text-base transition-transform">expand_more</span>
        </div>
      </summary>
      <div class="px-4 pb-4 pt-2 bg-gray-50 border-t border-outline-variant flex flex-wrap gap-4">
        <div class="text-center">
          <p class="text-xs text-gray-400">Tugas Selesai</p>
          <p class="text-sm font-bold text-gray-800">${h.totalSelesai || 0}</p>
        </div>
        <div class="text-center">
          <p class="text-xs text-gray-400">Total Poin</p>
          <p class="text-sm font-bold" style="color:#131b2e;">${h.totalPoin || 0} pts</p>
        </div>
        <div class="text-center">
          <p class="text-xs text-gray-400">Status</p>
          <span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:#e8f5e9;color:#069669;">${_kpiEsc(h.status || 'Terkunci')}</span>
        </div>
      </div>
    </details>
  `).join('');

  return `
    <div class="mx-4 mb-2">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Riwayat Shift</p>
      <div class="flex flex-col gap-2">${items}</div>
    </div>
  `;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */

function _attachKPIEvents() {
  /* Filter tabs — hanya visual, tampilkan toast untuk tab non-aktif */
  document.querySelectorAll('.kpi-filter-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!btn.dataset.active) {
        showToast('Fitur ini akan tersedia di versi berikutnya', 'info');
      }
    });
  });

  /* Expand icon rotate saat details terbuka */
  document.querySelectorAll('details').forEach(function (det) {
    det.addEventListener('toggle', function () {
      const icon = det.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.style.transform = det.open ? 'rotate(180deg)' : '';
      }
    });
  });
}

/* ============================================================
   HELPERS (scoped to avoid collision with Dashboard)
   ============================================================ */

function _kpiFormatTanggal(str) {
  if (!str) return '';
  const hariMap = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
  const bulanMap = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
    'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const d = new Date(str);
  if (isNaN(d)) return str;
  return `${hariMap[d.getDay()]}, ${d.getDate()} ${bulanMap[d.getMonth()]} ${d.getFullYear()}`;
}

function _kpiEsc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
